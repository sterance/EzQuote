name: Build Electron Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build renderer (electron mode)
        run: npm run build:electron:renderer

      - name: Cache electron-builder tools
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}\.cache\electron-builder
          key: electron-builder-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-builder-cache-${{ runner.os }}-

      - name: Package Windows executable
        run: npm run electron:pack
        env:
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder

      - name: Copy sample templates alongside executable
        run: Copy-Item -Path "src/data/sample-templates.json" -Destination "release/sample-templates.json"

      - name: Bundle exe and sample data into one zip
        run: Compress-Archive -Path "release/*.exe","release/sample-templates.json" -DestinationPath "release/EzQuote-Windows.zip"

      - name: Delete previous latest release
        run: gh release delete latest --yes --cleanup-tag
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          files: release/EzQuote-Windows.zip
